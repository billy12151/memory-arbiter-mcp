[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "memory-arbiter-mcp"
dynamic = ["version"]
description = "Local MCP memory with evidence-based recall and explicit conflict governance."
readme = "README.md"
requires-python = ">=3.11"
license = "Apache-2.0"
authors = [{ name = "张志维 (billy12151)" }]
dependencies = [
  "mcp>=1.2.0,<2",
  "pydantic>=2.6.0",
]

[project.optional-dependencies]
vec = ["sqlite-vec>=0.1.6"]
semantic-local = ["llama-cpp-python>=0.3.0"]
test = ["pytest>=8.0.0"]

[project.scripts]
memory-arbiter-mcp = "memory_arbiter.server:main"
memory-arbiter = "memory_arbiter.server:main"
mema = "memory_arbiter.server:main"
mema-production-smoke = "memory_arbiter.post_release_smoke:main"
# Subcommands (no separate console script; dispatched in server.main): doctor, setup, console

[tool.setuptools.packages.find]
include = ["memory_arbiter*"]

[tool.setuptools.package-data]
memory_arbiter = ["AGENT_ONBOARDING.md"]

[tool.setuptools.dynamic]
version = { attr = "memory_arbiter.__version__" }

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff.lint]
select = ["E9", "F63", "F7", "F82"]
