[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "memory-arbiter-mcp"
dynamic = ["version"]
description = "Local MCP memory with evidence-based recall and explicit conflict governance."
readme = "README.md"
requires-python = ">=3.11"
license = "Apache-2.0"
authors = [{ name = "张志维 (billy12151)" }]
dependencies = [
  "mcp>=1.29.0,<2",
  "pydantic>=2.6.0",
]

[project.optional-dependencies]
vec = ["sqlite-vec>=0.1.6"]
semantic-local = ["llama-cpp-python>=0.3.0"]
test = ["pytest>=8.0.0"]
# Refactor/maintenance tooling, never a runtime dependency. coverage backs the
# golden-gate branch-coverage check; vulture only generates dead-code
# candidates for manual triage and is deliberately not a CI gate.
dev = ["pytest>=8.0.0", "coverage>=7.0", "vulture>=2.14"]

[project.scripts]
memory-arbiter-mcp = "memory_arbiter.server:main"
memory-arbiter = "memory_arbiter.server:main"
mema = "memory_arbiter.server:main"
mema-production-smoke = "memory_arbiter.post_release_smoke:main"
# Subcommands (no separate console script; dispatched in server.main): doctor, setup, console, upgrade, migrate-vnext

[tool.setuptools.packages.find]
include = ["memory_arbiter*"]

[tool.setuptools.package-data]
memory_arbiter = ["AGENT_ONBOARDING.md", "FIRST_RUN_DEMO.zh-CN.md"]

[tool.setuptools.dynamic]
version = { attr = "memory_arbiter.__version__" }

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
# slow = real-Qwen tests (load the resident GGUF; ~minutes). Excluded from the
# default run and CI; run explicitly before a release: pytest -m slow
markers = [
    "slow: real-model tests, excluded by default; run with pytest -m slow",
]

[tool.ruff.lint]
# F401 (unused import) enabled 2026-09-14 after the 0.16.5 dead-code sweep
# zeroed memory_arbiter/ (38 offenders, three of them deliberate re-export
# seams carrying noqa). Check-only discipline: never bulk `--fix` F401 -- it
# would strip the seam imports (see the PR-6 UP-autofix lesson).
select = ["E9", "F401", "F63", "F7", "F82", "UP006", "UP007", "UP045"]

[tool.ruff.lint.per-file-ignores]
# 67 pre-existing unused imports in tests/scripts; clear them before removing
# these lines (tracked in the 0.16.5 plan, appendix A item 5).
"tests/**" = ["F401"]
"scripts/**" = ["F401"]

[tool.mypy]
strict = true

[[tool.mypy.overrides]]
module = ["sqlite_vec", "llama_cpp", "numpy"]
ignore_missing_imports = true

