[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "memory-arbiter-mcp"
version = "0.10.1"
description = "Local MCP memory arbiter with dual timeline conflict handling."
readme = "README.md"
requires-python = ">=3.11"
license = "Apache-2.0"
authors = [{ name = "张志维 (billy12151)" }]
dependencies = [
  "mcp>=1.2.0,<2",
  "pydantic>=2.6.0",
]

[project.optional-dependencies]
vec = ["sqlite-vec>=0.1.6"]
test = ["pytest>=8.0.0"]

[project.scripts]
memory-arbiter-mcp = "memory_arbiter.server:main"
memory-arbiter = "memory_arbiter.server:main"
mema = "memory_arbiter.server:main"
# Subcommands (no separate console script; dispatched in server.main): doctor, setup, console

[tool.setuptools.packages.find]
include = ["memory_arbiter*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
