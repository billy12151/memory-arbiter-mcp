name: Publish to PyPI

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      release_ref:
        description: "Release tag to build (for example: v0.13.0)"
        required: true
      publish:
        description: "Publish the built distributions to PyPI"
        required: true
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  build:
    name: Build, validate, and smoke distribution
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.release_ref || github.ref }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install build tooling
        run: python -m pip install --upgrade pip build twine

      - name: Verify release tag and metadata
        env:
          RELEASE_TAG: ${{ inputs.release_ref || github.event.release.tag_name }}
        run: |
          VERSION=$(python -c 'from memory_arbiter import __version__; print(__version__)')
          test "$RELEASE_TAG" = "v$VERSION" || { echo "tag $RELEASE_TAG does not match package v$VERSION" >&2; exit 1; }
          python scripts/sync_version.py --check

      - name: Run tests
        run: |
          python -m pip install -e '.[test]'
          python -m pytest -q

      - name: Build distributions
        run: python -m build

      - name: Check distributions
        run: python -m twine check dist/*

      - name: Smoke installed wheel
        run: |
          python -m venv /tmp/mema-wheel-smoke
          /tmp/mema-wheel-smoke/bin/python -m pip install --upgrade pip
          /tmp/mema-wheel-smoke/bin/python -m pip install dist/*.whl
          VERSION=$(python -c 'from memory_arbiter import __version__; print(__version__)')
          (cd /tmp && /tmp/mema-wheel-smoke/bin/python "$GITHUB_WORKSPACE/scripts/artifact_smoke.py" --expected-version "$VERSION")

      - name: Upload distribution artifacts
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/*

  publish:
    name: Publish distribution to PyPI
    needs: build
    runs-on: ubuntu-latest
    if: github.event_name == 'release' || (github.event_name == 'workflow_dispatch' && inputs.publish)
    permissions:
      id-token: write
      contents: read
    steps:
      - name: Download distribution artifacts
        uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
