name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  core:
    name: Core / Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e '.[test]'
      - run: python -m pytest -q

  vec:
    name: sqlite-vec / Python 3.12
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e '.[test,vec]'
      - run: python -m pytest -q

  quality:
    name: Quality, security, and wheel smoke
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e '.[test]' mypy ruff pip-audit build twine
      - run: python scripts/sync_version.py --check
      - run: python -m compileall -q memory_arbiter tests scripts
      - run: ruff check memory_arbiter tests scripts
      - run: python scripts/refactor_baseline/check_mypy.py
      - run: pip-audit -r requirements.txt
      - run: python -m build
      - run: python -m twine check dist/*
      - name: Smoke installed wheel
        run: |
          python -m venv /tmp/mema-wheel-smoke
          /tmp/mema-wheel-smoke/bin/python -m pip install --upgrade pip
          /tmp/mema-wheel-smoke/bin/python -m pip install dist/*.whl
          VERSION=$(python -c 'from memory_arbiter import __version__; print(__version__)')
          (cd /tmp && /tmp/mema-wheel-smoke/bin/python "$GITHUB_WORKSPACE/scripts/artifact_smoke.py" --expected-version "$VERSION")

  semantic-local-install:
    name: semantic-local install observation
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install --upgrade pip
      - name: Install optional local semantic backend
        run: python -m pip install -e '.[semantic-local]'
      - name: Report backend import
        run: python -c 'import llama_cpp; print(llama_cpp.__version__)'
